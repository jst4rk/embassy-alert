name: Check Migracion Panama

on:
  schedule:
    # 8:00 AM Panama time (UTC-5)
    - cron: "0 13 * * *"

  # Allows you to run it manually from GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check migration status
        env:
          PASSPORT: ${{ secrets.MIGRACION_PASSPORT }}
          CASE_NUMBER: ${{ secrets.MIGRACION_CASE }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
        run: node scripts/check-migracion.js

      - name: Save status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/migracion-status.json

          if git diff --cached --quiet; then
            echo "No status changes."
          else
            git commit -m "Update migracion status"
            git push
          fi
